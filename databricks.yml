# databricks.yml — Configuração do pipeline como código (Databricks Asset Bundle)
# Bônus 4: Deploy do Stream Pipeline — MBA Engenharia de Dados
#
# Como usar:
#   1. Instalar Databricks CLI: pip install databricks-cli
#   2. Configurar autenticação: databricks configure --token
#   3. Deploy: databricks bundle deploy --target prod
#   4. Executar manualmente: databricks bundle run crypto_stream_job --target prod

bundle:
  name: stream_pipeline_coingecko

# Variáveis parametrizáveis por ambiente
variables:
  num_batches:
    description: "Número de chamadas à API por execução"
    default: "5"
  poll_interval:
    description: "Intervalo em segundos entre chamadas à API"
    default: "15"

# Targets (ambientes)
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${workspace.host}   # definido em ~/.databrickscfg

  prod:
    mode: production
    workspace:
      host: ${workspace.host}

# Recursos gerenciados pelo bundle
resources:
  jobs:
    crypto_stream_job:
      name: "CryptoStream — MBA Stream Pipeline"
      description: >
        Pipeline de streaming de cotações de criptomoedas.
        Fonte: CoinGecko API v3. Output: Delta Lake (Parquet).
        Bônus implementados: schema, agregação, window functions.

      # Agendamento: a cada 15 minutos em produção
      schedule:
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED   # PAUSED em dev para não consumir créditos

      # Configuração do cluster de streaming
      job_clusters:
        - job_cluster_key: streaming_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"   # Azure; trocar por m5.xlarge na AWS
            num_workers: 2
            autoscale:
              min_workers: 1
              max_workers: 4
            spark_conf:
              # Estado do stream — persiste entre execuções
              spark.sql.streaming.checkpointLocation: "/dbfs/tmp/crypto_pipeline/checkpoint"
              # Compactação automática de arquivos Delta pequenos
              spark.databricks.delta.autoCompact.enabled: "true"
              # Otimização de leitura Delta
              spark.databricks.delta.optimizeWrite.enabled: "true"
            spark_env_vars:
              COINGECKO_BASE_URL: "https://api.coingecko.com/api/v3"
            libraries:
              - pypi:
                  package: "requests>=2.28.0"

      # Tasks do Job — execução sequencial
      tasks:
        - task_key: run_pipeline
          notebook_task:
            notebook_path: "notebooks/stream_pipeline_coingecko"
            base_parameters:
              NUM_BATCHES:   "${var.num_batches}"
              POLL_INTERVAL: "${var.poll_interval}"
          job_cluster_key: streaming_cluster
          timeout_seconds: 600   # 10 minutos de timeout
          retry_on_timeout: false
          max_retries: 2
          min_retry_interval_millis: 60000   # aguarda 1min entre retries

      # Notificações
      email_notifications:
        on_failure:
          - engenharia@empresa.com.br
        on_success: []   # não notificar em sucesso para evitar spam

      # Health checks
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 600   # alerta se demorar mais de 10min

      # Tags para organização e billing
      tags:
        project: "mba-stream-pipeline"
        environment: "prod"
        owner: "engenharia-dados"
        cost_center: "mba"
